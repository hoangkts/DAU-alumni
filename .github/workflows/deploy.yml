name: Deploy ALUMNI KTD to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-alumni-ktd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Kiểm tra TypeScript, Unit Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra TypeScript (lint)
        run: npm run lint

      - name: Chạy Unit Tests
        run: npm test

      - name: Build Frontend & Server
        run: npm run build

  deploy:
    name: Triển khai lên VPS Production
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra GitHub Secrets
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Chưa cấu hình đầy đủ GitHub Secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY) nên bỏ qua bước tự động deploy."
          {
            echo "## ⚠️ Chưa cấu hình GitHub Secrets để tự động Deploy"
            echo ""
            echo "Bước kiểm tra mã nguồn (\`verify\`) đã thành công. Để kích hoạt tự động deploy lên VPS mỗi khi \`git push\` vào nhánh \`main\`, quản trị viên cần vào **Settings → Secrets and variables → Actions** của repository và thêm các Repository Secrets:"
            echo ""
            echo "- \`VPS_HOST\`: Địa chỉ IP máy chủ VPS"
            echo "- \`VPS_USER\`: Tên tài khoản SSH được phân quyền deploy"
            echo "- \`VPS_SSH_KEY\`: Nội dung SSH Private Key (ed25519)"
            echo "- \`VPS_PORT\`: Cổng SSH (tuỳ chọn, mặc định \`22\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Run workflow thủ công thất bại vì chưa cấu hình đủ GitHub Secrets."
            exit 1
          fi

      - name: Cấu hình kết nối SSH
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Đồng bộ mã nguồn ứng dụng lên VPS
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          for dir in src server public; do
            if [ -d "$dir" ] && [ ! -L "$dir" ]; then
              rsync -rltz --no-links --no-perms --no-owner --no-group --omit-dir-times --delete \
                -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT} -o BatchMode=yes" \
                "${dir}/" "${VPS_USER}@${VPS_HOST}:/opt/alumni-ktd/${dir}/"
            fi
          done

          for f in package.json package-lock.json server.ts index.html tsconfig.json vite.config.ts metadata.json README.md .env.example .gitignore; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              rsync -ltz --no-links --no-perms --no-owner --no-group --inplace \
                -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT} -o BatchMode=yes" \
                "$f" "${VPS_USER}@${VPS_HOST}:/opt/alumni-ktd/$f"
            fi
          done

      - name: Build, khởi động lại và kiểm tra health trên VPS
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          sudo -n /usr/local/bin/alumni-ctl deploy
          for i in $(seq 1 30); do
            HEALTH="$(sudo -n /usr/local/bin/alumni-ctl health || true)"
            if printf '%s' "$HEALTH" | grep -q '"status":"ok"'; then
              echo "VPS health OK: $HEALTH"
              sudo -n /usr/local/bin/alumni-ctl status
              exit 0
            fi
            sleep 2
          done
          echo "Hết thời gian chờ ứng dụng sẵn sàng. Log container gần nhất:" >&2
          sudo -n /usr/local/bin/alumni-ctl logs app 80 >&2 || true
          exit 1
          EOF

      - name: Kiểm tra endpoint HTTPS công khai
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          PUBLIC_HEALTH="$(curl -fsS https://alumni.ktd.edu.vn/api/health)"
          echo "Public HTTPS health: $PUBLIC_HEALTH"
          {
            echo "## ✅ Deploy ALUMNI KTD thành công"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Website: https://alumni.ktd.edu.vn"
            echo "- API Health: \`${PUBLIC_HEALTH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dọn khóa SSH tạm trên runner
        if: always() && steps.check_secrets.outputs.ready == 'true'
        run: rm -f ~/.ssh/id_ed25519
