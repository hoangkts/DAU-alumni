    <script>
      (function() {
        try {
          var ua = navigator.userAgent || navigator.vendor || window.opera || '';
          var isAndroid = /Android/i.test(ua);
          var isInApp = /FBAN|FBAV|Instagram|Line|Zalo|ZaloTheme|ZaloPC|MicroMessenger/i.test(ua);
          if (isAndroid && isInApp && !window.location.hash.includes('no-intent')) {
            var target = window.location.href.replace(/^https?:\/\//, '');
            window.location.replace('intent://' + target + '#Intent;scheme=https;action=android.intent.action.VIEW;end');
          }
        } catch (e) {}
      })();
    </script>
